id = "helipengye.mybatis-tools"
name = "mybatis-tools"
version = "0.1.9"
description = "Navigates MyBatis mapper interfaces and XML references; completes statement ids, named parameters and Java properties in SQL placeholders and test expressions."
authors = ["OpenIDEA contributors"]
license = "Apache-2.0"
change-notes = "0.1.9 — reduces XML test-expression navigation latency with indexed Java declaration positions and lazy XML context parsing; resolves only references at the caret. Preserves shared SQL, inherited parameters, nested properties, foreach scopes and API 1.2 compatibility."
categories = ["frameworks"]
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-command:*"]

[capabilities]
required = ["project.read"]

[[contributes.providers]]
kinds = ["definition", "completion"]
languages = ["xml"]

[[contributes.providers]]
kinds = ["line-markers"]
languages = ["java", "xml"]
